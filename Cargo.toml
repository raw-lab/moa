[workspace]
resolver = "2"
members = ["moa", "vendor/hydra-mpp-core"]

# Release: tuned for the expansion/inflation inner loops. LTO + a single codegen
# unit let the optimizer inline the sparse compose and the per-column prune across
# module boundaries; the measured win on large graphs is worth the longer build.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
